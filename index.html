<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Tin E-Ink</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 15px; background: #f4f4f4; color: #111; }
        .box { background: #fff; border: 2px solid #000; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
        h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #000; padding-bottom: 5px; text-transform: uppercase; }
        p { font-size: 16px; line-height: 1.5; margin-bottom: 0; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Thông báo</h2>
        <p id="thong-bao">Đang tải...</p>
    </div>

    <div class="box">
        <h2>Lời Bác Hồ dạy ngày hôm nay</h2>
        <p id="loi-bac">Đang tải...</p>
    </div>

    <script>
        fetch('data.json?t=' + new Date().getTime())
            .then(response => response.json())
            .then(data => {
                // 1. Hiển thị thông báo
                document.getElementById('thong-bao').innerText = data.thong_bao;

                // 2. Tự động chọn lời Bác dạy theo ngày trong năm
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                const dayOfYear = Math.floor((now - start) / (1000 * 60 * 60 * 24));
                const list = data.loi_bac_day;
                const todayQuote = list[dayOfYear % list.length];
                
                document.getElementById('loi-bac').innerText = todayQuote;
            })
            .catch(err => console.error('Lỗi tải dữ liệu:', err));
    </script>
</body>
</html>
